[project]
name = "studyflow"
version = "0.1.0"
description = "StudyFlow AI: generador adaptativo de horarios de estudio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "tensorflow>=2.21.0",
    "openai>=3.42",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not llm_real'"
markers = ["llm_real: llama al LLM real (necesita OPENAI_API_KEY y gasta saldo)"]
